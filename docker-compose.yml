version: '3.8'

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.0
    container_name: 3pc-etcd
    environment:
      - ETCD_NAME=etcd0
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://etcd:2380
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      - ETCD_INITIAL_CLUSTER=etcd0=http://etcd:2380
      - ETCD_INITIAL_CLUSTER_TOKEN=3pc-etcd-cluster
      - ETCD_INITIAL_CLUSTER_STATE=new
    ports:
      - "2379:2379"
    networks:
      - 3pc-network
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://localhost:2379", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  coordinator:
    build: .
    container_name: 3pc-coordinator
    command: python3 -c "from coordinator.server import run_coordinator; run_coordinator(host='0.0.0.0', port=5000)"
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
    networks:
      - 3pc-network
    environment:
      - FLASK_ENV=development
      - ETCD_HOST=etcd
      - ETCD_PORT=2379
    depends_on:
      etcd:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  participant1:
    build: .
    container_name: 3pc-participant1
    command: python3 -c "from participant.server import run_participant; run_participant('participant_1', host='0.0.0.0', port=5001)"
    ports:
      - "5001:5001"
    networks:
      - 3pc-network
    depends_on:
      - coordinator  # 🆕 CHANGED - removed condition

  participant2:
    build: .
    container_name: 3pc-participant2
    command: python3 -c "from participant.server import run_participant; run_participant('participant_2', host='0.0.0.0', port=5002)"
    ports:
      - "5002:5002"
    networks:
      - 3pc-network
    depends_on:
      - coordinator  # 🆕 CHANGED - removed condition

  participant3:
    build: .
    container_name: 3pc-participant3
    command: python3 -c "from participant.server import run_participant; run_participant('participant_3', host='0.0.0.0', port=5003)"
    ports:
      - "5003:5003"
    networks:
      - 3pc-network
    depends_on:
      - coordinator  # 🆕 CHANGED - removed condition

  dashboard:
    build: .
    container_name: 3pc-dashboard
    command: python3 -m dashboard.app
    ports:
      - "8000:8000"
    networks:
      - 3pc-network
    depends_on:
      - coordinator  #  - removed condition

networks:
  3pc-network:
    driver: bridge